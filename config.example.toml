# Heraldvis config — copy ke config.toml dan sesuaikan (PRD FR-5, §14.3)
# Jalankan `heraldvis --check` untuk validasi dispatcher + whitelist tanpa butuh VPS.

endpoint = "http://127.0.0.1:8000" # VPS MI300X vLLM: http://129.212.186.196:8000/v1 — ganti saat serving ROCm aktif (PROGRES_LOG §13)
api_key = ""           # opsional — bearer token untuk VPS
mode = "text_only"     # text_only | voice

[tools]
open_application = true
read_file = true
write_file = true
run_test = true
git_operation = true
execute_command = true
navigate_browser = true
press_key = true
type_text = true
take_screenshot = true

[whitelist]
enabled = true   # Jika false -> bypass semua whitelist (Full Access Mode)
# Path prefix yang boleh diakses read_file/write_file/take_screenshot (FR-1 sandboxing, FR-6a)
allowed_paths = ["/tmp/heraldvis/", "./workspace/", "/tmp/"]
# Command base yang boleh dieksekusi execute_command/run_test/git_operation (FR-1a)
# Diperluas untuk dataset linux-command ~8700 sampel (PROGRES_LOG §12.2) — sesuaikan whitelist FR-1 saat eval paper
allowed_commands = ["cargo", "git", "ls", "cat", "echo", "npm", "pytest", "python", "python3", "grep", "find", "awk", "sed", "mkdir", "rm", "chmod", "cp", "mv", "head", "tail", "wc", "sort", "xargs", "rg"]

[voice]
stt_model = "parakeet-tdt-1.1b"
tts_model = "kokoro-82m"
