name: Heraldvis Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package artifact
        run: |
          mkdir -p heraldvis-linux-x86_64
          cp target/release/heraldvis heraldvis-linux-x86_64/
          cp config.example.toml heraldvis-linux-x86_64/config.toml
          cp scripts/install.sh heraldvis-linux-x86_64/install.sh
          tar -czvf heraldvis-linux-x86_64.tar.gz -C heraldvis-linux-x86_64 .
          cp scripts/install.sh ./install.sh
          ls -lh heraldvis-linux-x86_64.tar.gz install.sh
          sha256sum heraldvis-linux-x86_64.tar.gz || true

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Heraldvis ${{ github.ref_name }} — First Launch 🚀
          files: |
            heraldvis-linux-x86_64.tar.gz
            install.sh
          generate_release_notes: true
          body: |
            ## Heraldvis ${{ github.ref_name }} — First Launch 🚀

            > **Ubuntu only** — binary built on ubuntu-latest (libasound2). Other distros: use Docker or build from source.

            ### Quick Start — 1 command (curl + bash)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/Alfinpratamaa/heraldvis/main/scripts/install.sh | bash
            # or via release asset:
            # curl -fsSL https://github.com/Alfinpratamaa/heraldvis/releases/download/${{ github.ref_name }}/install.sh | bash
            ```

            Script akan:
            1. Download \`heraldvis-linux-x86_64.tar.gz\` dari rilis ini
            2. Extract + \`chmod +x heraldvis\`
            3. Prompt **Endpoint URL** (default \`http://127.0.0.1:8000\`) + **API Key** (opsional)
            4. Tampilkan perintah run siap pakai + jalankan \`--check\`

            ### Manual (tanpa script)

            ```bash
            curl -L -o heraldvis-linux-x86_64.tar.gz https://github.com/Alfinpratamaa/heraldvis/releases/download/${{ github.ref_name }}/heraldvis-linux-x86_64.tar.gz
            tar -xzf heraldvis-linux-x86_64.tar.gz
            ./heraldvis-linux-x86_64/heraldvis --check
            ./heraldvis-linux-x86_64/heraldvis --endpoint https://api.example.com --api-key sk-xxx
            ```

            ### Config precedence (FR-5a)
            \`--endpoint/--api-key\` > \`HERALDVIS_ENDPOINT/HERALDVIS_API_KEY\` > \`config.toml\` > \`127.0.0.1:8000\`

            ### What's Included
            - Tool-calling dispatcher (7 tools, whitelist sandbox)
            - Qwen3.8 27B fine-tuned adapter compatible
            - Full-duplex voice pipeline (Parakeet/Kokoro ready)
            - Bearer auth + multi-tier config precedence

      - name: Upload artifact (manual dispatch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: heraldvis-linux-x86_64
          path: heraldvis-linux-x86_64.tar.gz
