name: Heraldvis Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package artifact
        run: |
          mkdir -p heraldvis-linux-x86_64
          cp target/release/heraldvis heraldvis-linux-x86_64/
          cp config.example.toml heraldvis-linux-x86_64/config.toml
          tar -czvf heraldvis-linux-x86_64.tar.gz -C heraldvis-linux-x86_64 .
          ls -lh heraldvis-linux-x86_64.tar.gz
          sha256sum heraldvis-linux-x86_64.tar.gz || true

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Heraldvis ${{ github.ref_name }} — First Launch 🚀
          files: heraldvis-linux-x86_64.tar.gz
          generate_release_notes: true
          body: |
            ## Heraldvis ${{ github.ref_name }} — First Launch 🚀

            Standalone binary Ubuntu x86_64 + config.toml.

            ### Quick Start
            ```bash
            tar -xzf heraldvis-linux-x86_64.tar.gz
            ./heraldvis --check        # verify dispatcher
            ./heraldvis --help
            # 3 opsi konfigurasi (FR-5a): CLI flags > env > config.toml
            HERALDVIS_ENDPOINT=https://api.example.com HERALDVIS_API_KEY=sk-xxx ./heraldvis
            ./heraldvis --endpoint https://api.example.com --api-key sk-xxx
            ```

            ### What's Included
            - Tool-calling dispatcher (7 tools, whitelist sandbox)
            - Qwen3.8 27B fine-tuned adapter compatible
            - Full-duplex voice pipeline (Parakeet/Kokoro ready)
            - Bearer auth + multi-tier config precedence

      - name: Upload artifact (manual dispatch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: heraldvis-linux-x86_64
          path: heraldvis-linux-x86_64.tar.gz
